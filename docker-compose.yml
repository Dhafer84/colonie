services:
  colonie:
    build: .
    image: colonie:local
    container_name: colonie
    restart: unless-stopped
    # Uniquement sur 127.0.0.1 : l'accès se fait via Tailscale Serve (HTTPS, port 8086)
    ports:
      - "127.0.0.1:8085:8000"
    volumes:
      - ./data:/data
    environment:
      - TZ=Africa/Tunis
    mem_limit: 128m
    # Réseau de Homepage : son siteMonitor joint le jeu en interne (http://colonie:8000),
    # sans publier de port supplémentaire
    networks:
      - default
      - homepage
    labels:
      # Image construite localement : aucun registre à surveiller pour WUD
      - wud.watch=false
      - wud.display.name=Colonie spatiale
      - wud.display.icon=mdi:rocket-launch

  # Tests uniquement : `docker compose run --rm tests` (jamais lancé par `up`)
  tests:
    build:
      context: .
      target: test
    image: colonie:tests
    profiles: ["tests"]
    network_mode: none
    # Code monté en lecture seule : pas besoin de reconstruire après une modification
    volumes:
      - ./app:/srv/app:ro
      - ./tests:/srv/tests:ro

networks:
  homepage:
    external: true
    name: homepage_default
